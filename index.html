<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<title>Eski Java Oyunları - Tarayıcıda Oyna</title>
<meta name="description" content="Eski tip telefonlar için yapılmış Java (J2ME) oyunlarını tarayıcında doğrudan oyna." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
:root{
  --bg:#0a0a0f; --panel:#16161f; --panel2:#1e1e2a;
  --pink:#ff4fd8; --cyan:#00e5ff; --yellow:#ffe14f; --green:#5dff7a;
  --text:#d8d8e8; --dim:#8a8aa0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'VT323',monospace;font-size:20px}
body{
  display:flex;
  background:
    radial-gradient(1px 1px at 20% 30%, #fff3, transparent),
    radial-gradient(1px 1px at 60% 70%, #fff3, transparent),
    radial-gradient(1px 1px at 80% 20%, #fff2, transparent),
    radial-gradient(1px 1px at 40% 80%, #fff2, transparent),
    #0a0a0f;
}
aside{
  width:310px;flex:none;display:flex;flex-direction:column;
  border-right:1px solid #262636;background:#0a0a0fcc;backdrop-filter:blur(4px);
}
.brand{padding:16px 14px 8px;text-align:center}
.brand h1{
  font-family:'Press Start 2P',monospace;font-size:13px;margin:0 0 8px;
  color:var(--yellow);text-shadow:0 0 12px #ffe14f66, 0 0 30px #ff880044;line-height:1.6;
}
.brand .sub{color:var(--cyan);font-size:.9em;letter-spacing:1px}
.tools{display:flex;gap:8px;align-items:center;padding:10px 12px}
#search{
  flex:1;min-width:0;background:var(--panel2);border:2px solid var(--cyan);color:#fff;
  padding:8px 10px;font-family:inherit;font-size:1em;outline:none;border-radius:4px;
  box-shadow:0 0 10px #00e5ff33;
}
#search::placeholder{color:var(--dim)}
#search:focus{box-shadow:0 0 16px #00e5ff77}
#count{color:var(--dim);font-size:.9em;white-space:nowrap}
#list{flex:1;overflow-y:auto;padding:4px 8px 10px;scrollbar-width:thin;scrollbar-color:#2c2c40 transparent}
.row{
  padding:5px 10px;cursor:pointer;border:1px solid transparent;border-radius:4px;
  color:var(--text);font-size:1.02em;line-height:1.25;word-break:break-word;
}
.row:nth-child(odd){background:#16161f66}
.row:hover{border-color:var(--cyan);color:#fff;background:#00e5ff14}
.row.active{border-color:var(--pink);background:#ff4fd822;color:#fff;box-shadow:0 0 10px #ff4fd844}
.empty{text-align:center;color:var(--dim);padding:30px 10px;font-size:1.05em}
.credit{padding:8px 12px;border-top:1px solid #1e1e2a;color:var(--dim);font-size:.8em;text-align:center}
.credit a{color:var(--cyan)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.keymap{
  display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;
  padding:8px 12px;background:#16161fe6;border-bottom:1px solid #262636;
}
.km{display:flex;align-items:center;gap:5px;font-size:.92em;color:var(--text)}
kbd{
  font-family:'Press Start 2P',monospace;font-size:9px;background:var(--panel2);
  border:1px solid #3a3a52;border-bottom-width:3px;border-radius:4px;color:var(--cyan);
  padding:4px 6px;min-width:22px;text-align:center;
}
.km b{color:var(--yellow);font-weight:normal}
.kmhint{width:100%;text-align:center;color:var(--dim);font-size:.85em}
#stage{position:relative;flex:1;min-height:0}
#frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:none}
#placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:1.2em;text-align:center;padding:20px;
}
#back{
  display:none;position:absolute;top:10px;left:10px;z-index:5;
  background:var(--panel2);border:2px solid var(--cyan);color:var(--cyan);
  font-family:inherit;font-size:.95em;padding:6px 12px;border-radius:4px;cursor:pointer;
}
@media (max-width:760px){
  body{flex-direction:column}
  aside{width:100%;height:100%;border-right:0}
  main{display:none}
  body.playing aside{display:none}
  body.playing main{display:flex}
  body.playing #back{display:block}
  .brand{padding-top:10px}
}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <h1>ESKİ JAVA OYUNLARI</h1>
    <div class="sub">★ tarayıcında doğrudan oyna ★</div>
  </div>
  <div class="tools">
    <input id="search" type="search" placeholder="oyun ara..." autocomplete="off" />
    <span id="count"></span>
  </div>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">oyun bulunamadı :(</div>
  <div class="credit">J2ME emülatörü: <a href="https://github.com/iqbaladinur/j2me-player" target="_blank" rel="noopener">J2ME Player</a></div>
</aside>
<main>
  <div class="keymap">
    <span class="km"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> <b>yön</b></span>
    <span class="km"><kbd>Enter</kbd> <b>onay</b></span>
    <span class="km"><kbd>F1</kbd> <b>sol tuş</b></span>
    <span class="km"><kbd>F2</kbd> <b>sağ tuş</b></span>
    <span class="km"><kbd>Esc</kbd> <b>menü</b></span>
    <span class="km"><kbd>0</kbd>–<kbd>9</kbd> <b>rakamlar</b></span>
    <span class="km"><kbd>*</kbd> NumPad <b>×</b> <kbd>#</kbd> NumPad <b>÷</b></span>
    <span class="kmhint">klavye için önce oyun ekranına tıkla · bazı oyunlarda 2/4/6/8 yön, 5 onay çalışır</span>
  </div>
  <div id="stage">
    <button id="back">← Oyun listesi</button>
    <iframe id="frame" title="Oyun ekranı" allowfullscreen></iframe>
    <div id="placeholder">← Soldan bir oyun seç</div>
  </div>
</main>

<script>
let games = [];
const listEl = document.getElementById('list');
const searchEl = document.getElementById('search');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');
const frameEl = document.getElementById('frame');
const placeholderEl = document.getElementById('placeholder');

function isMobile(){ return matchMedia('(pointer:coarse)').matches || innerWidth < 760; }

function gameUrl(g){
  let u = 'run.html?jar=' + encodeURIComponent(g.p);
  if (isMobile()) u += '&mobile=1';
  return u;
}

let filtered = [];
function render(){
  const q = searchEl.value.trim().toLocaleLowerCase('tr');
  filtered = games.filter(g => !q || g.n.toLocaleLowerCase('tr').includes(q));
  countEl.textContent = filtered.length + ' oyun';
  emptyEl.style.display = filtered.length ? 'none' : '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < filtered.length; i++){
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.i = i;
    row.textContent = filtered[i].n;
    frag.appendChild(row);
  }
  listEl.innerHTML = '';
  listEl.appendChild(frag);
}

function select(i, row){
  const prev = listEl.querySelector('.row.active');
  if (prev) prev.classList.remove('active');
  row.classList.add('active');
  frameEl.src = gameUrl(filtered[i]);
  frameEl.style.display = 'block';
  placeholderEl.style.display = 'none';
  document.body.classList.add('playing');
}

listEl.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) select(+row.dataset.i, row);
});

document.getElementById('back').addEventListener('click', () => {
  document.body.classList.remove('playing');
});

searchEl.addEventListener('input', render);

fetch('games.json').then(r=>r.json()).then(data=>{
  games = data;
  render();
}).catch(()=>{
  emptyEl.style.display = '';
  emptyEl.textContent = 'oyun listesi yüklenemedi';
});
</script>
</body>
</html>
